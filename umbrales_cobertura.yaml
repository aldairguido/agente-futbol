# ==============================================================================
# UMBRALES OFICIALES UNIFICADOS DE COBERTURA Y DECISIÓN (D2 - FUENTE ÚNICA DE VERDAD)
# Puntos 44 y 45: Auditoría de Cobertura Comparable y Bloqueo sin Evidencia.
# ==============================================================================

umbrales:
  # Historial oficial estricto por club (15P oficiales completos, cero amistosos)
  min_partidos_oficiales: 15  # validación empírica de estabilidad temporal de ratings

  # Umbral mínimo de partidos con detalle FT por equipo (ej. Caso Tavernes: 2 < 3)
  min_partidos_con_detalle_por_equipo: 3  # regla operativa, sin validación cronológica

  # Umbral mínimo de filas emparejadas con detalle estadístico comparable
  min_filas_emparejadas: 3  # regla operativa, sin validación cronológica

  # Umbral mínimo de métricas comunes en FT para calificar una fila como comparable
  min_claves_comunes_ft: 5  # regla operativa, sin validación cronológica

  # Mínimo de pares emparejados con dato observado para habilitar un modelo de mercado
  min_pares_mercado: 8  # regla operativa, sin validación cronológica

  # Umbral de activación para la red completa 45-DCN
  min_pares_red_45: 15  # regla operativa, sin validación cronológica
  min_claves_comunes_red_45: 45  # regla operativa, sin validación cronológica

  # Umbral mínimo de partidos con cronología verificada para Cuadro C y Veredicto (minutos por tramo)
  min_partidos_cronologia_verificada: 10  # regla operativa, sin validación cronológica

  # Cuota justa mínima para calificar una línea como no trivial en el Top 5
  min_cuota_justa_no_trivial_top5: 1.25  # regla operativa, sin validación cronológica

  # Desvío máximo permitido entre probabilidad del modelo y frecuencia observada (puntos porcentuales)
  # Todo mercado con desvío > umbral se excluye del Top 5 y de SECCIÓN 1 (o se publica con etiqueta "sin calibración validada")
  max_desvio_frecuencia_observada_pts: 10.0  # cautela estructural sin validación cronológica

  # Salvaguarda estructural: el bloqueo por recorte de lambda > 15% sin cronología es independiente de la calibración
  bloqueo_recorte_independiente_calibracion: true  # cautela estructural sin validación cronológica

  # Regla 21: Tope máximo de lambda ofensivo para equipos con Attack_Rating < 35.0 (umbral 35.0 introducido heurísticamente en e68fff4a el 2026-11-09: regla operativa sin validación)
  techo_lambda_ataque_bajo: 1.10  # regla operativa, sin validación cronológica

  # Regla 23 / Patrón 26: Umbral de poder de cierre en 2T (sesgo diésel)
  umbral_p26_cierre_2t: 0.51  # regla operativa, sin validación cronológica

  # Parámetros Set B (solo activos bajo bandera explícita) — regla operativa, sin validación cronológica
  min_partidos_corners_por_equipo: 8  # regla operativa, sin validación cronológica
  min_muestra_corners_dispersion: 5  # regla operativa, sin validación cronológica
  factor_dispersion_nb_corners: 1.05  # regla operativa, sin validación cronológica
  min_eval_familia_veto_top5: 10  # regla operativa, sin validación cronológica
  brecha_veto_top5_pp: -10.0  # regla operativa, sin validación cronológica
  max_brecha_familia_top5_pp: -10.0  # regla operativa, sin validación cronológica
  ev_minimo_calibrado: 0.0  # regla operativa, sin validación cronológica
  fraccion_kelly: 0.25  # regla operativa, sin validación cronológica
  stake_max_pct: 5.0  # regla operativa, sin validación cronológica
  techo_ajuste_red_dcn_pct: 18.0  # regla operativa, sin validación cronológica
  peso_condicion_tensor: 0.65  # regla operativa, sin validación cronológica
  peso_general_tensor: 0.35  # regla operativa, sin validación cronológica
  peso_torneo_actual_coef: 0.70  # regla operativa, sin validación cronológica
  peso_promedio_15p_coef: 0.30  # regla operativa, sin validación cronológica
  ratio_coef_shared_min: 0.90  # regla operativa, sin validación cronológica
  ratio_coef_shared_max: 1.10  # regla operativa, sin validación cronológica
  peso_prob_modelo_gatekeeper: 0.60  # regla operativa, sin validación cronológica
  peso_tasa_empirica_gatekeeper: 0.40  # regla operativa, sin validación cronológica
  umbral_promocion_empirica_top5: 0.85  # regla operativa, sin validación cronológica
  min_corners_visita_freno: 3.0  # hipótesis, no validada
  max_corners_concedidos_local_freno: 5.0  # hipótesis, no validada

# Banderas de comportamiento Set (B) — TODAS APAGADAS POR DEFECTO hasta validación prospectiva >= 30 partidos
flags_comportamiento:
  usar_anclaje_coef_torneo: false  # regla operativa, sin validación cronológica
  usar_tope_dcn_18_pct: false  # regla operativa, sin validación cronológica
  usar_tensor_65_35_y_diesel: false  # regla operativa, sin validación cronológica
  usar_micropatrones_combinatorios: false  # hipótesis, no validada
  usar_gatekeeper_multisenal_top5: false  # regla operativa, sin validación cronológica
  usar_sobredispersion_nb_corners: true  # regla operativa sin validación
  usar_gate_corners_8_15: false  # regla operativa, sin validación cronológica
  usar_gate_cronologia_mitades_10_15: false  # regla operativa, sin validación cronológica
  usar_calibracion_y_veto_conciencia: false  # regla operativa, sin validación cronológica
  usar_cuota_justa_114_top5: false  # regla operativa, sin validación cronológica
  usar_guarda_doble_defensa_rota: false  # regla operativa, sin validación cronológica
  usar_gate_goles_mitad_15_15: false  # regla operativa, sin validación cronológica
  usar_kelly_conservador_min_3pct: false  # regla operativa, sin validación cronológica
  usar_excluir_primer_gol_top5: false  # regla operativa, sin validación cronológica
  usar_filtro_ruido_ic_factores_dcn: false  # regla operativa, sin validación cronológica
  usar_reescalado_sin_inversion_signo_dcn: false  # regla operativa, sin validación cronológica
  usar_tercer_brazo_plano_sombra: true  # regla operativa, sin validación cronológica
  usar_sin_dato_si_mitades_no_suman_ft: false  # regla operativa, sin validación cronológica
  usar_unificacion_h_gf_lstm_15: false  # unificación directa/viva _partido_fuente(p) tras bandera
  usar_corners_reglas_65e377e_diag: false  # diagnóstico in-sample reglas córneres 65e377e
  usar_cuotas_mercado_captura: true  # regla operativa, sin validación cronológica
  usar_cuotas_en_ticket: false  # regla operativa, sin validación cronológica
  usar_cierre_remoto_cuotas_en_evaluar: false  # regla operativa, sin validación cronológica

# Gobierno de pendientes Entrega 1b (Ronda 7 Punto 6)
stake_max_conservador_kelly: 0.03  # regla operativa, sin validación cronológica
min_partidos_goles_mitad: 15  # regla operativa, sin validación cronológica

# Regla Futura de Promoción de Cambios de Comportamiento (Ronda 7 Punto 7)
regla_futura:
  min_partidos_modo_sombra: 30  # regla operativa, sin validación cronológica
  exigir_datos_no_diseno: true
  exigir_brier_y_logloss_con_ic_por_partido: true
  exigir_bandera_apagada_por_defecto: true
  exigir_modo_sombra_dual_en_libro: true
  prohibir_regla_ad_hoc_por_partido: true

# Motor Autónomo de Descubrimiento Jerárquico de Patrones (Conjunto B / Modo Sombra)
motor_autonomo_ronda19:
  # Todas las banderas de comportamiento nacen APAGADAS (Conjunto B / Modo Sombra)
  activar_motor_autonomo_dpp: false          # Maestro del módulo en modo sombra/activo
  activar_selector_dpp_top5: false           # PoolDPP-MAP (Alg. 2) para diversificar el Top 5
  activar_filtro_cvar25_top5: false          # Filtro de cola CVaR_25 >= umbral sobre 9 escenarios
  activar_alerta_entrelazamiento_knn: false  # Semáforo topológico k-NN / Gauss link
  activar_proyeccion_faa_mercados: false     # Proyección final única FAA al politopo coherente
  activar_pesos_walkforward_oos: false       # Ajuste logit w <- w - eta * grad(L) en producción

  # Hiperparámetros del Explorador Jerárquico (Capa 1 — regla operativa, sin validación cronológica)
  orden_maximo_patrones: 5
  cobertura_minima_variable: 0.60
  soporte_minimo_por_orden:
    1: 12
    2: 10
    3: 8
    4: 8
    5: 8
  beam_width_por_orden:
    1: 24
    2: 120
    3: 200
    4: 250
    5: 250
  ganancia_marginal_minima_ll: 0.005
  jaccard_maximo_padre_hijo: 0.95
  suavizado_laplace_alpha0: 4.0

  # Hiperparámetros PoolDPP-MAP (Capa 2)
  k_patrones_ortogonales: 10
  temperatura_global_dpp_patrones: 1.5
  temperatura_global_dpp_top5: 2.0

  # Hiperparámetros φTD Cramér y CVaR_25 (Capa 3)
  cramer_n_frecuencias: 128
  cramer_pareto_xm: 0.001
  cramer_omega_max: 15.0
  cramer_semilla_fija: 42
  cvar25_umbral_minimo_top5: 0.65
  riesgo_entropico_eta: -4.0

  # Hiperparámetros Topología y Aduana FDR (Capa 4)
  knn_entrelazamiento_k: 8
  entrelazamiento_umbral_cautela: 0.75
  fdr_benjamini_hochberg_q_max: 0.05
  probe_auc_minimo: 0.52

  # Gobernanza estricta (regla_futura — heredada de Ronda 7)
  min_partidos_oos_para_encender: 30
  min_partidos_oos_para_red_gelu: 250
