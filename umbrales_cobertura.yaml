# ==============================================================================
# UMBRALES OFICIALES UNIFICADOS DE COBERTURA Y DECISIÓN (D2 - FUENTE ÚNICA DE VERDAD)
# Puntos 44 y 45: Auditoría de Cobertura Comparable y Bloqueo sin Evidencia.
# ==============================================================================

umbrales:
  # Historial oficial estricto por club (15P oficiales completos, cero amistosos)
  min_partidos_oficiales: 15  # validación empírica de estabilidad temporal de ratings

  # Umbral mínimo de partidos con detalle FT por equipo (ej. Caso Tavernes: 2 < 3)
  min_partidos_con_detalle_por_equipo: 3  # regla operativa, sin validación cronológica

  # Umbral mínimo de filas emparejadas con detalle estadístico comparable
  min_filas_emparejadas: 3  # regla operativa, sin validación cronológica

  # Umbral mínimo de métricas comunes en FT para calificar una fila como comparable
  min_claves_comunes_ft: 5  # regla operativa, sin validación cronológica

  # Mínimo de pares emparejados con dato observado para habilitar un modelo de mercado
  min_pares_mercado: 8  # regla operativa, sin validación cronológica

  # Umbral de activación para la red completa 45-DCN
  min_pares_red_45: 15  # regla operativa, sin validación cronológica
  min_claves_comunes_red_45: 45  # regla operativa, sin validación cronológica

  # Umbral mínimo de partidos con cronología verificada para Cuadro C y Veredicto (minutos por tramo)
  min_partidos_cronologia_verificada: 10  # regla operativa, sin validación cronológica

  # Cuota justa mínima para calificar una línea como no trivial en el Top 5
  min_cuota_justa_no_trivial_top5: 1.25  # regla operativa, sin validación cronológica

  # Desvío máximo permitido entre probabilidad del modelo y frecuencia observada (puntos porcentuales)
  # Todo mercado con desvío > umbral se excluye del Top 5 y de SECCIÓN 1 (o se publica con etiqueta "sin calibración validada")
  max_desvio_frecuencia_observada_pts: 10.0  # cautela estructural sin validación cronológica

  # Salvaguarda estructural: el bloqueo por recorte de lambda > 15% sin cronología es independiente de la calibración
  bloqueo_recorte_independiente_calibracion: true  # cautela estructural sin validación cronológica

  # Regla 21: Tope máximo de lambda ofensivo para equipos con Attack_Rating < 35.0
  techo_lambda_ataque_bajo: 1.10  # regla operativa, sin validación cronológica

  # Regla 23 / Patrón 26: Umbral de poder de cierre en 2T (sesgo diésel)
  # Aísla el cuartil superior (P75 = 0.6041) de equipos con aceleración extrema en 2T
  umbral_p26_cierre_2t: 0.51  # regla operativa, sin validación cronológica
